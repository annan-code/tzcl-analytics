*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EDF1FB; --surface:#FFFFFF; --surface2:#F6F8FD; --panel:#2E374E;
  --ink:#1F283D; --muted:rgba(31,40,61,.56); --faint:rgba(31,40,61,.34);
  --line:rgba(31,40,61,.11); --track:rgba(31,40,61,.09);
  --amber:#FFB405; --link:#2E4AD9;
  --chat:#008DCE; --cowork:#BA63DA; --code:#00C0B0; --spend:#FFB405;
  --ok:#00C0B0; --warn:#FFB405; --bad:#FE8348;
  --d-tech:#008DCE; --d-ops:#00C0B0; --d-sol:#FE8348;
  --d-prod:#BA63DA; --d-ei:#EE9DDA; --d-ceo:#69B2F5;
}
body.dark{
  --bg:#1B2334; --surface:#232D42; --surface2:#1F283A; --panel:#141B29;
  --ink:#EDF1FB; --muted:rgba(237,241,251,.58); --faint:rgba(237,241,251,.36);
  --line:rgba(237,241,251,.13); --track:rgba(237,241,251,.10);
}
body{background:var(--bg);color:var(--ink);min-height:100vh;padding:26px 26px 40px;
  font-family:"Good Sans","Work Sans",ui-sans-serif,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
.page{max-width:1360px;margin:0 auto}
a{color:var(--link);text-decoration:none}

/* ── password gate ─────────────────────────────────────── */
.gate{max-width:430px;margin:12vh auto;background:var(--surface);
  border:1px solid var(--line);border-radius:6px;padding:38px 36px}
.gate .mark{width:150px;margin-bottom:26px}
.gate .mark svg{width:100%;height:auto;display:block}
.gate h2{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-bottom:9px}
.gate p{font-size:.83rem;color:var(--muted);line-height:1.65;margin-bottom:22px}
.gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:4px;
  background:var(--surface2);color:var(--ink);font-size:.95rem;outline:none;font-family:inherit}
.gate input:focus{border-color:var(--link)}
.gate button{width:100%;margin-top:11px;padding:12px;border:none;border-radius:100px;
  background:var(--ink);color:var(--surface);font-size:.9rem;font-weight:500;
  cursor:pointer;font-family:inherit}
.gate button:disabled{opacity:.5;cursor:default}
.gate .err{color:var(--bad);font-size:.82rem;margin-top:12px;min-height:1.15em}

/* ── header ────────────────────────────────────────────── */
.brand{width:172px;margin-bottom:12px}
.brand svg{width:100%;height:auto;display:block}
body.dark .brand svg path{fill:var(--ink)}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap}
.head-l{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:2.35rem;font-weight:700;letter-spacing:-.03em;line-height:1}
.org{font-size:.8rem;color:var(--faint);text-transform:uppercase;letter-spacing:.13em}
.pills{display:flex;gap:7px;flex-wrap:wrap}
.pill{padding:7px 15px;border-radius:100px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font-size:.79rem;cursor:pointer;white-space:nowrap;font-family:inherit;
  transition:background .15s,color .15s}
.pill:hover{border-color:var(--faint)}
.pill.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill .now{font-size:.6rem;opacity:.7;margin-left:5px;text-transform:uppercase;letter-spacing:.08em}

.rule{border-top:1px solid var(--ink);margin:16px 0 0;opacity:.85}
.views{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:20px}
.view{padding:13px 0;border:none;background:none;font-family:inherit;font-size:.95rem;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.view:hover{color:var(--ink)}
.view.on{color:var(--ink);font-weight:500;border-bottom-color:var(--amber)}

.wnote{display:inline-flex;align-items:center;gap:9px;flex-wrap:wrap;
  border:1px solid var(--line);background:var(--surface);border-radius:100px;
  padding:7px 17px;font-size:.79rem;color:var(--muted);margin-bottom:18px}
.wnote b{color:var(--ink);font-weight:500}
.wnote .sep{color:var(--faint)}
.wnote .live{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:500}
.wnote .live i{width:6px;height:6px;border-radius:50%;background:var(--amber);display:block}

/* ── cards ─────────────────────────────────────────────── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:19px 21px 21px}
.card.dark{background:var(--panel);border-color:var(--panel)}
.card.dark .k-label{color:var(--amber)}
.card.dark .k-sub{color:rgba(237,241,251,.62)}
.card.dark .k-num{color:#fff}
.k-label{font-size:.7rem;font-weight:500;color:var(--muted);text-transform:uppercase;
  letter-spacing:.11em;margin-bottom:11px}
.k-num{font-family:"Redaction 35",Georgia,serif;font-size:2.15rem;line-height:1;letter-spacing:0}
.k-num .of{font-size:1rem;color:var(--muted);font-family:inherit}
.k-sub{font-size:.775rem;color:var(--muted);margin-top:11px;line-height:1.55}
.k-num.chat{color:var(--chat)}.k-num.cowork{color:var(--cowork)}
.k-num.code{color:var(--code)}.k-num.spend{color:var(--spend)}

.waffle{display:flex;flex-wrap:wrap;gap:3px;margin-top:12px;max-width:210px}
.waffle i{width:11px;height:11px;background:var(--amber);display:block}
.waffle i.off{background:var(--track)}

/* ── panels ────────────────────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:19px 21px 21px;margin-bottom:18px}
.p-title{font-size:.7rem;font-weight:500;color:var(--muted);text-transform:uppercase;
  letter-spacing:.11em;margin-bottom:16px}
.p-note{font-size:.74rem;color:var(--faint);font-weight:400;text-transform:none;
  letter-spacing:0;margin-left:9px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
@media(max-width:980px){.g2,.g3{grid-template-columns:1fr}}

.note{background:var(--surface2);border-top:2px solid var(--amber);border-radius:0 0 4px 4px;
  padding:13px 15px;font-size:.79rem;color:var(--muted);line-height:1.65;margin-top:16px}
.note b{color:var(--ink);font-weight:500}

/* ── bars ──────────────────────────────────────────────── */
.bars{display:grid;gap:11px}
.bar{display:flex;align-items:center;gap:14px}
.bar.click{cursor:pointer;border-radius:4px;padding:2px 4px;margin:-2px -4px}
.bar.click:hover{background:var(--surface2)}
.bar.on{background:var(--surface2);outline:1px solid var(--line)}
.bar-l{font-size:.82rem;width:172px;flex-shrink:0}
.bar-t{flex:1;height:7px;background:var(--track);border-radius:100px;overflow:hidden;min-width:50px}
.bar-f{height:100%;border-radius:100px;transition:width .4s ease}
.bar-v{font-size:.78rem;color:var(--muted);width:104px;text-align:right;flex-shrink:0;
  font-variant-numeric:tabular-nums}

/* ── leaderboards ──────────────────────────────────────── */
.lb{display:grid;gap:1px}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.lb-row:last-child{border-bottom:none}
.lb-i{font-size:.7rem;color:var(--faint);width:13px;flex-shrink:0;font-variant-numeric:tabular-nums}
.lb-n{flex:1;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-s{font-size:.71rem;color:var(--faint);margin-top:2px}
.lb-v{font-size:1.05rem;flex-shrink:0;font-family:"Redaction 35",Georgia,serif}
.lb-u{font-size:.68rem;color:var(--muted);margin-left:5px;font-family:inherit}
.lb-empty{font-size:.79rem;color:var(--faint);padding:12px 2px}

/* ── controls + table ──────────────────────────────────── */
.ctrls{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.ctrl-l{font-size:.7rem;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.11em}
input.q,select.sel{background:var(--surface);border:1px solid var(--line);border-radius:4px;
  padding:9px 12px;color:var(--ink);font-size:.83rem;outline:none;font-family:inherit}
input.q{width:250px}
input.q::placeholder{color:var(--faint)}
input.q:focus,select.sel:focus{border-color:var(--link)}
.csv{padding:9px 19px;border:none;border-radius:100px;background:var(--amber);color:#3d2a00;
  font-size:.81rem;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.csv:hover{filter:brightness(.96)}
.cnt{font-size:.77rem;color:var(--faint);margin-left:auto;font-variant-numeric:tabular-nums}
.key{display:flex;gap:14px;flex-wrap:wrap}
.key-i{display:flex;align-items:center;gap:6px;font-size:.73rem;color:var(--muted)}
.sq{width:9px;height:9px;flex-shrink:0}
.sq-a{background:var(--ok)}.sq-m{background:var(--warn)}.sq-n{background:var(--bad)}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th{text-align:left;padding:0 12px 11px;color:var(--muted);font-size:.68rem;font-weight:500;
  text-transform:uppercase;letter-spacing:.11em;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--surface2)}
tbody tr.none td{opacity:.55}
.nm{display:flex;align-items:center;gap:11px}
.nm-d{width:8px;height:8px;flex-shrink:0}
.nm-t{font-weight:500;line-height:1.3}
.nm-s{font-size:.73rem;color:var(--muted);margin-top:2px;line-height:1.35}
.chip{display:inline-block;padding:3px 10px;border-radius:3px;font-size:.65rem;font-weight:500;
  text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;
  border:1px solid currentColor;background:transparent}
.n{text-align:right;font-variant-numeric:tabular-nums}
.n.chat{color:var(--chat)}.n.cowork{color:var(--cowork)}
.n.code{color:var(--code)}.n.spend{color:var(--spend)}
.n.z{color:var(--faint)}
.days{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.nodata{text-align:center;padding:38px;color:var(--faint);font-size:.87rem}

.stack{display:flex;height:26px;gap:2px;border-radius:3px;overflow:hidden}
.stack i{display:block;transition:opacity .15s}
.stack i:hover{opacity:.75}
.slegend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.slegend span{display:flex;align-items:center;gap:7px;font-size:.75rem;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.legend{display:flex;gap:18px;flex-wrap:wrap}
.legend-i{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--muted);
  cursor:pointer;user-select:none}
.legend-i.off{opacity:.32}
.legend-i i{width:16px;height:2px;display:block;flex-shrink:0}
.tag{display:inline-block;padding:2px 8px;border-radius:100px;font-size:.63rem;font-weight:500;
  color:var(--cowork);border:1px solid currentColor;letter-spacing:.05em}
.foot{font-size:.74rem;color:var(--faint);text-align:center;margin-top:26px;padding-top:18px;
  border-top:1px solid var(--line);line-height:1.75}
.hide{display:none!important}
</style>
</head>

  <div class="head">
    <div class="head-l">
      <h1>Claude Analytics</h1>
      <div class="org" id="org"></div>
    </div>
    <div class="pills">
      <span id="monthPills" style="display:contents"></span>
      <button class="pill" id="modeBtn" onclick="toggleMode()">Dark mode</button>
    </div>
  </div>
  <div class="rule"></div>
  <div class="views">
    <button class="view on" id="v-monthly" onclick="setView('monthly')">Monthly adoption</button>
    <button class="view" id="v-usage" onclick="setView('usage')">Usage detail</button>
    <button class="view" id="v-cost" onclick="setView('cost')">Cost</button>
  </div>
  <div id="app"></div>
  <div class="foot" id="foot"></div>
</div>

<script>
/* ═══ decryption gate ═══════════════════════════════════ */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const res = await fetch('data.enc?v=' + Date.now());
  if(!res.ok) throw new Error('Could not load the data file (HTTP ' + res.status + ')');
  const p = await res.json();
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(p.salt), iterations:p.iterations, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(p.iv)}, key, b64(p.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
const gate=document.getElementById('gate'), pwEl=document.getElementById('pw'),
      goEl=document.getElementById('go'), errEl=document.getElementById('err');
async function attempt(){
  if(!pwEl.value) return;
  goEl.disabled=true; goEl.textContent='Decrypting…'; errEl.textContent='';
  try{
    DATA = await unlock(pwEl.value);
    gate.classList.add('hide');
    document.getElementById('page').classList.remove('hide');
    boot();
  }catch(e){
    errEl.textContent = /operation|decrypt/i.test(e.message||String(e))
      ? 'Wrong password.' : ('Could not open: ' + e.message);
    goEl.disabled=false; goEl.textContent='Unlock'; pwEl.select();
  }
}
goEl.addEventListener('click', attempt);
pwEl.addEventListener('keydown', e => { if(e.key==='Enter') attempt(); });
pwEl.focus();

/* ═══ state ═════════════════════════════════════════════ */
let DATA=null, MONTHS=[], currentMonth=null, view='monthly';
let deptFilter='all', sortKey='name', term='', hidden={};

const DCOL={'Technology':'var(--d-tech)','Operations':'var(--d-ops)',
  'Solutions Engineering':'var(--d-sol)','Product':'var(--d-prod)',
  'Engagement & Insights':'var(--d-ei)','Office of CEO':'var(--d-ceo)'};
const CAT=['#008DCE','#00C0B0','#FE8348','#BA63DA','#EE9DDA','#69B2F5','#D9DA7E'];

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'—':Number(n).toLocaleString('en-GB');
const money=n=>'$'+Number(n).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>'$'+Math.round(Number(n)).toLocaleString('en-GB');
const pc=n=>Math.round(n*100)+'%';
const nameOf=e=>(e||'').split('@')[0].replace(/\./g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const MONL={Jan:'January',Feb:'February',Mar:'March',Apr:'April',May:'May',Jun:'June',
  Jul:'July',Aug:'August',Sep:'September',Oct:'October',Nov:'November',Dec:'December'};
function niceDate(iso){ if(!iso) return 'unknown';
  const [y,m,d]=iso.split('-').map(Number);
  return d+' '+Object.values(MONL)[m-1]+' '+y; }
function statusOf(m,days){
  if(!m.daysActive) return {k:'none',label:'No usage',c:'var(--bad)'};
  if(m.daysActive/days>=0.4) return {k:'active',label:'Active',c:'var(--ok)'};
  return {k:'min',label:'Minimal',c:'var(--warn)'};
}

function boot(){
  MONTHS=Object.keys(DATA.months);
  currentMonth=MONTHS[MONTHS.length-1];
  document.getElementById('org').textContent =
    DATA.meta.org+' · '+DATA.meta.seats+' seats'+
    (DATA.meta.accounts&&DATA.meta.accounts!==DATA.meta.seats?' · '+DATA.meta.accounts+' accounts':'');
  paintPills(); render();
}
function paintPills(){
  document.getElementById('monthPills').innerHTML = MONTHS.map((m,i)=>
    '<button class="pill'+(m===currentMonth?' on':'')+'" onclick="setMonth(\''+m+'\')">'+esc(m)+
    (i===MONTHS.length-1?'<span class="now">now</span>':'')+'</button>').join('');
}
function setMonth(m){ currentMonth=m; deptFilter='all'; term=''; paintPills(); render(); }
function setView(v){
  view=v;
  ['monthly','usage','cost'].forEach(k=>document.getElementById('v-'+k).classList.toggle('on',k===v));
  document.getElementById('monthPills').style.display = v==='monthly'?'contents':'none';
  render();
}
function toggleMode(){
  document.body.classList.toggle('dark');
  document.getElementById('modeBtn').textContent =
    document.body.classList.contains('dark')?'Light mode':'Dark mode';
  render();
}

function render(){
  if(!DATA) return;
  document.getElementById('app').innerHTML =
    view==='monthly'?vMonthly(): view==='usage'?vUsage(): vCost();
  if(view==='monthly') paintRows();
  document.getElementById('foot').innerHTML =
    'Monthly figures: '+esc(DATA.meta.monthlySource)+'.<br>'+
    'Usage detail and cost: '+esc(DATA.snapshot.source)+', fetched '+
    esc(niceDate(DATA.snapshot.fetchedAt.slice(0,10)))+'.';
}

function windowNote(){
  const s=DATA.snapshot;
  if(view==='monthly'){
    const md=DATA.months[currentMonth], p=md.period.replace(/\s*\(partial\)\s*/i,'');
    const live=currentMonth===MONTHS[MONTHS.length-1];
    const mn=currentMonth.split(' ');
    return '<div class="wnote"><b>'+esc((MONL[mn[0]]||mn[0])+' '+mn[1])+'</b>'+
      '<span class="sep">·</span>'+esc(p)+'<span class="sep">·</span>'+md.days+' days counted'+
      (live?'<span class="sep">·</span><span class="live"><i></i>Month in progress</span>':'')+
      '<span class="sep">·</span>Data accurate to <b>'+esc(niceDate(s.dataAsOf))+'</b></div>';
  }
  return '<div class="wnote">'+esc(view==='cost'?'Month to date · 1 – 10 August 2026 · USD':s.window)+
    '<span class="sep">·</span>Data accurate to <b>'+esc(niceDate(s.dataAsOf))+'</b></div>';
}

function card(label,val,sub,cls,extra){
  return '<div class="card'+(cls==='dark'?' dark':'')+'"><div class="k-label">'+esc(label)+'</div>'+
    '<div class="k-num '+(cls&&cls!=='dark'?cls:'')+'">'+val+'</div>'+
    (extra||'')+(sub?'<div class="k-sub">'+esc(sub)+'</div>':'')+'</div>';
}

/* ═══ VIEW 1 · MONTHLY ══════════════════════════════════ */
function vMonthly(){
  const md=DATA.months[currentMonth];
  if(!md) return '<div class="nodata">No data for this month.</div>';
  const all=md.members, act=all.filter(m=>m.daysActive>0);
  const sum=k=>act.reduce((a,b)=>a+(b[k]||0),0);
  const seats=DATA.meta.seats;
  const waffle='<div class="waffle">'+Array.from({length:seats},(_,i)=>
    '<i class="'+(i<act.length?'':'off')+'"></i>').join('')+'</div>';

  let h=windowNote();
  h+='<div class="panel">'+trend()+'</div>';
  h+='<div class="cards">'+
    card('Active users',act.length+' <span class="of">/ '+seats+'</span>',
      Math.round(act.length/seats*100)+'% of seats used this month, one square per seat','',waffle)+
    card('Chat messages',fmt(sum('messages')),
      'Sent in Claude Chat · '+Math.round(sum('messages')/(act.length||1))+' avg per active user','chat')+
    card('Cowork messages',fmt(sum('coworkMessages')),
      'Claude working on files and tasks · '+act.filter(m=>m.coworkMessages>0).length+' users','cowork')+
    card('Code sessions',fmt(sum('codeSessions')),
      'Claude Code terminal sessions · '+act.filter(m=>m.codeSessions>0).length+' users','code')+
    card('Estimated spend',money0(sum('spend')),'Chat and Cowork usage charges','dark')+
    '</div>';
  h+='<div class="panel">'+depts(md)+'</div>';
  h+='<div class="g3">'+
    board('Heaviest chat users','by messages sent in Claude Chat','messages','msgs','var(--chat)',act)+

function trend(){
  const S=[{k:'messages',l:'Chat messages',c:'#008DCE'},
           {k:'coworkMessages',l:'Cowork messages',c:'#BA63DA'},
           {k:'codeSessions',l:'Code sessions',c:'#00C0B0'}];
  const pts=MONTHS.map(m=>{const mem=DATA.months[m].members,o={m:m.split(' ')[0]};
    S.forEach(s=>o[s.k]=mem.reduce((a,b)=>a+(b[s.k]||0),0)); return o;});
  const vis=S.filter(s=>!hidden[s.k]);
  const max=Math.max(1,...pts.flatMap(p=>vis.map(s=>p[s.k])));
  const W=1200,H=270,PL=64,PR=76,PT=14,PB=34,iw=W-PL-PR,ih=H-PT-PB;
  const x=i=>PL+(pts.length===1?iw/2:i*iw/(pts.length-1)), y=v=>PT+ih-(v/max)*ih;
  let g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:270px" role="img" aria-label="Usage trend">';
  for(let i=0;i<=4;i++){const gy=PT+ih-(i/4)*ih;
    g+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="var(--line)"/>'+
       '<text x="'+(PL-12)+'" y="'+(gy+4)+'" fill="var(--faint)" font-size="11" text-anchor="end">'+
       Math.round(max*i/4).toLocaleString('en-GB')+'</text>';}
  pts.forEach((p,i)=>{const last=i===pts.length-1;
    g+='<text x="'+x(i)+'" y="'+(H-10)+'" fill="'+(last?'var(--ink)':'var(--faint)')+
       '" font-size="11" text-anchor="middle"'+(last?' font-weight="500"':'')+'>'+esc(p.m)+'</text>';});
  vis.forEach(s=>{
    g+='<path d="'+pts.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p[s.k])).join(' ')+
       '" fill="none" stroke="'+s.c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach((p,i)=>{g+='<circle cx="'+x(i)+'" cy="'+y(p[s.k])+'" r="3.4" fill="'+s.c+
      '" stroke="var(--surface)" stroke-width="2"><title>'+esc(p.m)+' · '+esc(s.l)+': '+fmt(p[s.k])+'</title></circle>';});
  });
  const last=pts[pts.length-1];
  const lab=vis.map(s=>({c:s.c,v:last[s.k],y:y(last[s.k])})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<lab.length;i++) if(lab[i].y-lab[i-1].y<14) lab[i].y=lab[i-1].y+14;
  lab.forEach(l=>{g+='<text x="'+(x(pts.length-1)+11)+'" y="'+(l.y+4)+'" fill="'+l.c+
    '" font-size="11.5" font-weight="500">'+fmt(l.v)+'</text>';});
  g+='</svg>';
  const leg=S.map(s=>'<div class="legend-i'+(hidden[s.k]?' off':'')+'" onclick="tog(\''+s.k+'\')">'+
    '<i style="background:'+s.c+'"></i>'+esc(s.l)+'</div>').join('');
  return '<div style="display:flex;justify-content:space-between;align-items:center;gap:14px;'+
    'flex-wrap:wrap;margin-bottom:14px"><div class="p-title" style="margin:0">Usage trends · '+
    esc(MONTHS[0].toUpperCase())+' – '+esc(MONTHS[MONTHS.length-1].toUpperCase())+
    '<span class="p-note">click a legend item to show or hide a line</span></div>'+
    '<div class="legend">'+leg+'</div></div><div style="overflow-x:auto">'+g+'</div>';
}
function tog(k){ hidden[k]=!hidden[k]; render(); }

function depts(md){
  const tot=DATA.meta.deptTotals||{}, by={};
  Object.keys(tot).forEach(d=>by[d]={total:tot[d],active:0});
  md.members.forEach(m=>{ by[m.dept]=by[m.dept]||{total:0,active:0};
    if(m.daysActive>0) by[m.dept].active++; });
  const rows=Object.entries(by).sort((a,b)=>b[1].total-a[1].total).map(([d,v])=>{
    const p=v.total?v.active/v.total:0;
    return '<div class="bar click'+(deptFilter===d?' on':'')+'" onclick="setDept('+
      JSON.stringify(d).replace(/"/g,'&quot;')+')"><div class="bar-l">'+esc(d)+'</div>'+
      '<div class="bar-t"><div class="bar-f" style="width:'+(p*100)+'%;background:'+
      (DCOL[d]||'var(--faint)')+'"></div></div>'+
      '<div class="bar-v">'+v.active+'/'+v.total+' ('+Math.round(p*100)+'%)</div></div>';
  }).join('');
  return '<div class="p-title">Adoption by department<span class="p-note">click to filter the table below</span></div>'+
    '<div class="bars">'+rows+'</div>';
}
function setDept(d){ deptFilter=(deptFilter===d?'all':d); render(); }

function usageSplit(md){

function rowsNow(){
  const md=DATA.months[currentMonth];
  let r=md.members.slice();
  if(deptFilter!=='all') r=r.filter(m=>m.dept===deptFilter);
  const t=term.trim().toLowerCase();
  if(t) r=r.filter(m=>m.name.toLowerCase().includes(t)||
    (m.title||'').toLowerCase().includes(t)||(m.dept||'').toLowerCase().includes(t));
  r.sort((a,b)=>sortKey==='name'?a.name.localeCompare(b.name):(b[sortKey]||0)-(a[sortKey]||0));
  return {r,md};
}
function paintRows(){
  const tb=document.getElementById('tb'); if(!tb) return;
  const {r,md}=rowsNow(), days=md.days;
  tb.innerHTML = r.length ? r.map(m=>{
    const st=statusOf(m,days), col=DCOL[m.dept]||'var(--faint)';
    const n=(v,c)=>'<td class="n '+(v?c:'z')+'">'+(v?fmt(v):'—')+'</td>';
    return '<tr class="'+(st.k==='none'?'none':'')+'">'+
      '<td><div class="nm"><span class="nm-d" style="background:'+st.c+'" title="'+st.label+'"></span>'+
      '<div><div class="nm-t">'+esc(m.name)+'</div><div class="nm-s">'+esc(m.title)+'</div></div></div></td>'+
      '<td><span class="chip" style="color:'+col+'">'+esc(m.dept)+'</span></td>'+
      '<td class="days">'+m.daysActive+' / '+days+'</td>'+
      n(m.messages,'chat')+n(m.coworkMessages,'cowork')+n(m.codeSessions,'code')+
      '<td class="n '+(m.spend?'spend':'z')+'">'+(m.spend?money(m.spend):'—')+'</td></tr>';
  }).join('') : '<tr><td colspan="7" class="nodata">Nobody matches that.</td></tr>';
  const c=document.getElementById('cnt');
  if(c) c.textContent=r.length+' of '+md.members.length+' members';
  /* lock height so filtering never shifts the page under the cursor */
  const box=document.getElementById('tbox');
  if(box && deptFilter==='all' && !term.trim()){
    box.style.minHeight='0px'; box.style.minHeight=box.offsetHeight+'px';

}

function csv(){
  const {r,md}=rowsNow(); if(!r.length) return;
  const out=r.map(m=>({Name:m.name,Title:m.title,Department:m.dept,
    Status:statusOf(m,md.days).label,'Days active':m.daysActive,'Days in period':md.days,
    'Chat messages':m.messages,'Cowork messages':m.coworkMessages,
    'Code sessions':m.codeSessions,'Spend USD':(m.spend||0).toFixed(2)}));
  const h=Object.keys(out[0]);
  const body=[h.join(',')].concat(out.map(x=>h.map(k=>{
    const v=String(x[k]); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(','))).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([body],{type:'text/csv'}));
  a.download='TZ_Claude_'+currentMonth.replace(' ','_')+'.csv'; a.click();
  URL.revokeObjectURL(a.href);
}

function daily(days){
  const W=1200,H=210,PL=60,PR=20,PT=16,PB=32,iw=W-PL-PR,ih=H-PT-PB;
  const max=Math.max(1,...days.map(d=>d.value)), bw=iw/days.length*0.56;
  let g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:210px" role="img" aria-label="Daily spend">';
  for(let i=0;i<=4;i++){const gy=PT+ih-(i/4)*ih;
    g+='<line x1="'+PL+'" y1="'+gy+'" x2="'+(W-PR)+'" y2="'+gy+'" stroke="var(--line)"/>'+
       '<text x="'+(PL-11)+'" y="'+(gy+4)+'" fill="var(--faint)" font-size="11" text-anchor="end">$'+
       Math.round(max*i/4)+'</text>';}
  days.forEach((d,i)=>{const cx=PL+(i+0.5)*iw/days.length, bh=(d.value/max)*ih;
    g+='<rect x="'+(cx-bw/2)+'" y="'+(PT+ih-bh)+'" width="'+bw+'" height="'+Math.max(bh,1)+
       '" rx="3" fill="#FFB405"><title>'+esc(d.date)+': $'+d.value+'</title></rect>'+
       '<text x="'+cx+'" y="'+(H-10)+'" fill="var(--faint)" font-size="10" text-anchor="middle">'+
       esc(d.date.slice(8))+'</text>';
    if(d.value>max*0.4) g+='<text x="'+cx+'" y="'+(PT+ih-bh-7)+'" fill="var(--ink)" font-size="10.5" '+
      'font-weight="500" text-anchor="middle">$'+d.value+'</text>';});
  return '<div style="overflow-x:auto">'+g+'</svg></div>';
}
function prod(sp){
  const max=Math.max(...sp.byProduct.map(p=>p.projectedEom));
  const tot=sp.byProduct.reduce((a,b)=>a+b.projectedEom,0);
  return '<div class="panel" style="margin:0"><div class="p-title">Projected spend by product'+
    '<span class="p-note">at month end</span></div><div class="bars">'+
    sp.byProduct.map((p,i)=>'<div class="bar"><div class="bar-l">'+esc(p.product)+'</div>'+
      '<div class="bar-t"><div class="bar-f" style="width:'+(p.projectedEom/max*100)+'%;background:'+
      CAT[i]+'"></div></div><div class="bar-v">'+money0(p.projectedEom)+'</div></div>').join('')+
    '</div><div class="note">Cowork is '+Math.round(sp.byProduct[0].projectedEom/tot*100)+
    '% of projected spend.</div></div>';
}
function model(sp){
  const max=Math.max(...sp.byModel.map(m=>m.spend))||1;
  return '<div class="panel" style="margin:0"><div class="p-title">Spend by model</div><div class="bars">'+
    sp.byModel.map((m,i)=>'<div class="bar"><div class="bar-l">'+esc(m.model)+'</div>'+
      '<div class="bar-t"><div class="bar-f" style="width:'+(m.spend/max*100)+'%;background:'+
      CAT[i]+'"></div></div><div class="bar-v">'+money0(m.spend)+'</div></div>').join('')+'</div></div>';
}
function spenders(sp){
  return '<div class="panel" style="margin:0"><div class="p-title">Highest spend by member'+
    '<span class="p-note">rolling 30 days</span></div><div class="lb">'+
    sp.topMembers.map((m,i)=>'<div class="lb-row"><div class="lb-i">'+(i+1)+'</div>'+
      '<div class="lb-n">'+esc(nameOf(m.email))+'</div>'+
      '<div class="lb-v" style="color:var(--spend)">'+money(m.spend)+'</div></div>').join('')+'</div></div>';
}
function conc(sp){
  return '<div class="panel" style="margin:0"><div class="p-title">Spend concentration'+
    '<span class="p-note">share of total spend by user decile, highest first</span></div><div class="bars">'+
    sp.concentration.deciles.map((v,i)=>'<div class="bar"><div class="bar-l">'+
      (i===0?'Top 10%':(i*10)+'–'+((i+1)*10)+'%')+'</div><div class="bar-t">'+
      '<div class="bar-f" style="width:'+(v*100)+'%;background:'+(i===0?'var(--bad)':'var(--chat)')+
      '"></div></div><div class="bar-v">'+Math.round(v*100)+'%</div></div>').join('')+'</div></div>';
}
</script>
</body>
</html>
